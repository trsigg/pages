<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Random Redirect</title>
    <meta http-equiv="refresh" content="0; url=https://www.google.com" />
    <script src="../assets/broop-sites.js"></script>
    <script src="../assets/broop-random.js"></script>
    <script>
      (function () {
        function parsePathParam() {
          var params = new URLSearchParams(window.location.search);
          var raw = params.get("path");
          if (!raw) {
            return [];
          }
          return raw
            .split(",")
            .map(function (value) {
              return parseInt(value.trim(), 10);
            })
            .filter(function (value) {
              return Number.isFinite(value);
            });
        }
        var path = parsePathParam();
        var selection = path.length
          ? window.BroopRandom.pickTargetWithPath(window.BROOP_SITES, path)
          : window.BroopRandom.pickTarget(window.BROOP_SITES);
        var target = selection.url;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
