<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Random Redirect</title>
    <meta http-equiv="refresh" content="0; url=https://www.google.com" />
    <script>
      (function () {
        var sites = [
          { weight: 1, url: "https://www.sporcle.com/games/random.php" },
          { weight: 1, url: "https://www.theatlantic.com/games/bracket-city/" },
          // youtube
          { weight: 1, children: [
            // big iron
            { weight: 1, children: [
              {weight: 1, url: "https://www.youtube.com/watch?v=-NuX79Ud8zI" }, // base
              {weight: 1, url: "https://www.youtube.com/watch?v=j_Dyg2Dw5xI" }, // alphabet
              {weight: 1, url: "https://www.youtube.com/watch?v=3156gSmTFo0" }, // reconstructed
            ] },
            // steamed hams
            { weight: 1, children: [
              {weight: 1, url: "https://www.youtube.com/watch?v=4jXEuIHY9ic" }, // base
            ] },
          ] },
          // nyt
          { weight: 1, children: [
            {weight: 1, url: "https://www.nytimes.com/crosswords/game/daily" },
            {weight: 1, url: "https://www.nytimes.com/crosswords/game/daily/2001/09/11" },
            {weight: 1, url: "https://www.nytimes.com/puzzles/spelling-bee" },
          ] },
        ];
        function pickWeighted(nodes) {
          var totalWeight = nodes.reduce(function (sum, node) {
            return sum + node.weight;
          }, 0);
          var roll = Math.random() * totalWeight;
          var chosen = nodes[0];
          for (var i = 0; i < nodes.length; i++) {
            roll -= nodes[i].weight;
            if (roll <= 0) {
              chosen = nodes[i];
              break;
            }
          }
          if (chosen.children) {
            return pickWeighted(chosen.children);
          }
          return chosen.url;
        }
        var target = pickWeighted(sites);
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
