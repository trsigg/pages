<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Broop</title>
    <style>
      :root {
        color-scheme: only dark;
        --frame-width: 30%;
        --frame-height: 16%;
        --frame-left: 35%;
        --frame-top: 42%;
        --frame-x: 0px;
        --frame-y: 0px;
        --viewport-width: 1920px;
        --viewport-height: 1080px;
        --frame-scale: 0.1;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: #0b0b0d;
        color: #d8d8d8;
        font-family: "Courier New", Courier, monospace;
        display: grid;
        place-items: center;
      }
      .stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .backdrop {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        filter: drop-shadow(0 25px 45px rgba(0, 0, 0, 0.65));
      }
      .backdrop img {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        display: block;
      }
      .screen-space {
        position: absolute;
        pointer-events: none;
      }
      .frame {
        position: absolute;
        left: calc(var(--frame-left) + var(--frame-x));
        top: calc(var(--frame-top) + var(--frame-y));
        width: var(--frame-width);
        height: var(--frame-height);
        overflow: hidden;
        background: #090909;
        pointer-events: auto;
      }
      .viewport {
        width: var(--viewport-width);
        height: var(--viewport-height);
        transform: scale(var(--frame-scale));
        transform-origin: top left;
      }
      .viewport iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
      .loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, rgba(16, 16, 18, 0.8), rgba(8, 8, 10, 0.5));
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-size: 12px;
      }
      .frame.ready .loading {
        display: none;
      }
      .blocked-overlay {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        text-align: center;
        background: rgba(6, 6, 8, 0.82);
        color: #f5f1ed;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 16px;
        z-index: 2;
      }
      .blocked-overlay a {
        margin-top: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid rgba(245, 241, 237, 0.4);
        color: inherit;
        text-decoration: none;
      }
      .frame.blocked .blocked-overlay {
        display: grid;
      }
    </style>
    <script src="../assets/broop-sites.js"></script>
    <script src="../assets/broop-random.js"></script>
    <script>
      (function () {
        var backdrops = [
          {
            src: "../assets/broop-tv-1.png",
            settings: {
              "--frame-width": "43.7%",
              "--frame-height": "32%",
              "--frame-left": "28%",
              "--frame-top": "21.5%",
              "--frame-x": "0px",
              "--frame-y": "0px",
            },
          },
          {
            src: "../assets/broop-tv-2.png",
            settings: {
              "--frame-width": "36.2%",
              "--frame-height": "29.5%",
              "--frame-left": "31.3%",
              "--frame-top": "30%",
              "--frame-x": "0px",
              "--frame-y": "0px",
            },
          },
        ];
        var pickedBackdrop =
          backdrops[Math.floor(Math.random() * backdrops.length)];
        var selection = window.BroopRandom.pickTarget(window.BROOP_SITES);

        function updateScale() {
          var frameEl = document.querySelector(".frame");
          if (!frameEl) {
            return;
          }
          var frameWidth = frameEl.clientWidth;
          var frameHeight = frameEl.clientHeight;
          if (!frameWidth || !frameHeight) {
            return;
          }
          document.documentElement.style.setProperty(
            "--viewport-width",
            frameWidth.toFixed(2) + "px"
          );
          document.documentElement.style.setProperty(
            "--viewport-height",
            frameHeight.toFixed(2) + "px"
          );
          document.documentElement.style.setProperty("--frame-scale", "1");
        }

        function init() {
          var backdropImg = document.querySelector(".backdrop-image");
          var stageEl = document.querySelector(".stage");
          var screenSpace = document.querySelector(".screen-space");
          var frameEl = document.querySelector(".frame");
          var iframe = document.querySelector("iframe");
          backdropImg.src = pickedBackdrop.src;
          Object.keys(pickedBackdrop.settings).forEach(function (key) {
            document.documentElement.style.setProperty(
              key,
              pickedBackdrop.settings[key]
            );
          });
          function updateScreenSpace() {
            var stageRect = stageEl.getBoundingClientRect();
            var imageRect = backdropImg.getBoundingClientRect();
            screenSpace.style.left = imageRect.left - stageRect.left + "px";
            screenSpace.style.top = imageRect.top - stageRect.top + "px";
            screenSpace.style.width = imageRect.width + "px";
            screenSpace.style.height = imageRect.height + "px";
            updateScale();
          }
          if (backdropImg.complete) {
            updateScreenSpace();
          } else {
            backdropImg.addEventListener("load", updateScreenSpace);
          }
          window.addEventListener("resize", updateScreenSpace);
          if (selection.blocked) {
            frameEl.classList.add("blocked");
            var blockedLink = document.querySelector(".blocked-link");
            blockedLink.href = selection.url;
            iframe.src = "about:blank";
            iframe.setAttribute("title", "Blocked iframe");
          } else {
            var embed = selection.embed || function (url) {
              return { src: url, attrs: {} };
            };
            var embedConfig = embed(selection.url);
            var attrs = embedConfig.attrs || {};
            iframe.src = embedConfig.src;
            Object.keys(attrs).forEach(function (key) {
              iframe.setAttribute(key, attrs[key]);
            });
          }
          iframe.addEventListener("load", function () {
            frameEl.classList.add("ready");
          });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
  </head>
  <body>
    <div class="stage">
      <div class="backdrop" aria-hidden="true">
        <img class="backdrop-image" alt="" />
      </div>
      <div class="screen-space">
        <div class="frame">
        <div class="loading">Tuning</div>
        <div class="blocked-overlay">
          <div>Blocked iframe</div>
          <a class="blocked-link" target="_blank" rel="noreferrer">Open in new tab</a>
        </div>
        <div class="viewport">
          <iframe title="Broop Frame" loading="eager"></iframe>
        </div>
        </div>
      </div>
    </div>
  </body>
</html>
