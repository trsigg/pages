<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Broop</title>
    <style>
      :root {
        color-scheme: only dark;
        --frame-width: min(29vw, 980px);
        --frame-height: min(15vw, 560px);
        --frame-x: -4px;
        --frame-y: -23px;
        --viewport-width: 1920px;
        --viewport-height: 1080px;
        --frame-scale: 0.1;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: #0b0b0d;
        color: #d8d8d8;
        font-family: "Courier New", Courier, monospace;
        display: grid;
        place-items: center;
      }
      .stage {
        position: relative;
        width: min(92vw, 1200px);
        aspect-ratio: 16 / 9;
        display: grid;
        place-items: center;
      }
      .backdrop {
        position: absolute;
        inset: 0;
        background: center / contain no-repeat;
        filter: drop-shadow(0 25px 45px rgba(0, 0, 0, 0.65));
      }
      .frame {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) translate(var(--frame-x), var(--frame-y));
        width: var(--frame-width);
        height: var(--frame-height);
        overflow: hidden;
        background: #090909;
      }
      .viewport {
        width: var(--viewport-width);
        height: var(--viewport-height);
        transform: scale(var(--frame-scale));
        transform-origin: top left;
      }
      .viewport iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
      .loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, rgba(16, 16, 18, 0.8), rgba(8, 8, 10, 0.5));
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-size: 12px;
      }
      .frame.ready .loading {
        display: none;
      }
    </style>
    <script src="../assets/broop-sites.js"></script>
    <script src="../assets/broop-random.js"></script>
    <script>
      (function () {
        var backdrops = ["../assets/broop-tv-1.png", "../assets/broop-tv-2.png"];
        var pickedBackdrop =
          backdrops[Math.floor(Math.random() * backdrops.length)];
        var target = window.BroopRandom.pickUrl(window.BROOP_SITES);

        function updateScale() {
          var rootStyle = getComputedStyle(document.documentElement);
          var viewportWidth = parseFloat(
            rootStyle.getPropertyValue("--viewport-width")
          );
          var viewportHeight = parseFloat(
            rootStyle.getPropertyValue("--viewport-height")
          );
          if (!viewportWidth || !viewportHeight) {
            return;
          }
          var frameEl = document.querySelector(".frame");
          var scale = Math.min(
            frameEl.clientWidth / viewportWidth,
            frameEl.clientHeight / viewportHeight
          );
          document.documentElement.style.setProperty(
            "--frame-scale",
            scale.toFixed(4)
          );
        }

        function init() {
          var backdropEl = document.querySelector(".backdrop");
          var frameEl = document.querySelector(".frame");
          var iframe = document.querySelector("iframe");
          backdropEl.style.backgroundImage = 'url("' + pickedBackdrop + '")';
          iframe.src = target;
          updateScale();
          window.addEventListener("resize", updateScale);
          iframe.addEventListener("load", function () {
            frameEl.classList.add("ready");
          });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
  </head>
  <body>
    <div class="stage">
      <div class="backdrop" aria-hidden="true"></div>
      <div class="frame">
        <div class="loading">Tuning</div>
        <div class="viewport">
          <iframe title="Broop Frame" loading="eager"></iframe>
        </div>
      </div>
    </div>
  </body>
</html>
